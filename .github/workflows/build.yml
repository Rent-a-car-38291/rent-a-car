name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # With JAVA_HOME on a JDK 25 the Kotlin Toolchain uses it instead of downloading one from GitHub, which has been failing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Test
        run: ./kotlin test

      - name: Build
        run: ./kotlin build
