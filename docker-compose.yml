# Local database for ./kotlin run. The defaults match resources/application.yaml.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rentacar
      POSTGRES_USER: rentacar
      POSTGRES_PASSWORD: rentacar
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
