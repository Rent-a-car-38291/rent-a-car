openapi: 3.0.3
info:
  title: Rent my car API
  version: 0.1.0
  description: Cars, accounts and organizations are stored in PostgreSQL. Login tokens are kept in memory, so everyone logs in again after a restart.
paths:
  /cars:
    get:
      tags: [Cars]
      summary: List all cars
      responses:
        "200":
          description: All cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      tags: [Cars]
      summary: Offer a car
      description: The logged-in user becomes the owner. A new car is always Available. fuelType is only for ICE, and capacity and consumption are always required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Malformed body, or a missing, unknown or out-of-range field (a negative mileage or rate, a missing capacity)
        "401":
          description: Missing or invalid token
        "409":
          description: Another car already has this license plate
  /cars/{id}:
    put:
      tags: [Cars]
      summary: Update your own car
      description: Same body as POST /cars. The owner and the status stay as they are, and the type can't change.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "200":
          description: Car updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Non-numeric id, invalid field, unknown field or a different type
        "401":
          description: Missing or invalid token
        "403":
          description: Someone else's car
        "404":
          description: Unknown id
        "409":
          description: Another car already has this license plate
    delete:
      tags: [Cars]
      summary: Remove your own car
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Car removed
        "400":
          description: Non-numeric id
        "401":
          description: Missing or invalid token
        "403":
          description: Someone else's car
        "404":
          description: Unknown id
  /accounts:
    post:
      tags: [Accounts]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created (the password is never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Missing or invalid field (empty name, invalid email, password shorter than 8 characters)
        "409":
          description: Email already registered (case-insensitive)
  /login:
    post:
      tags: [Accounts]
      summary: Log in and get a bearer token
      description: Copy the token into "Authorize" at the top of the page to call endpoints that need a login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Missing field or a body that isn't JSON
        "401":
          description: Wrong email or password
  /logout:
    post:
      tags: [Accounts]
      summary: Log out
      description: Revokes the token of this request only. Your other logins keep working.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Missing or invalid token
  /accounts/{id}:
    put:
      tags: [Accounts]
      summary: Update your own name and email
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Non-numeric id, empty name or invalid email
        "401":
          description: Missing or invalid token
        "403":
          description: Someone else's account
        "404":
          description: Unknown id
        "409":
          description: Email already registered (case-insensitive)
    delete:
      tags: [Accounts]
      summary: Delete your own account
      description: Your cars are deleted too.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Account deleted
        "400":
          description: Non-numeric id
        "401":
          description: Missing or invalid token
        "403":
          description: Someone else's account
        "404":
          description: Unknown id
  /accounts/{id}/password:
    put:
      tags: [Accounts]
      summary: Change your own password
      description: Your other logins are logged out, the one you are using keeps working.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Non-numeric id or a new password shorter than 8 characters
        "401":
          description: Missing or invalid token
        "403":
          description: Someone else's account, or the current password is wrong
        "404":
          description: Unknown id
  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      description: The logged-in user becomes its admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Empty name
        "401":
          description: Missing or invalid token
  /organizations/{id}/invites:
    post:
      tags: [Organizations]
      summary: Create an invite code (admin only)
      description: The code works once and expires after 7 days.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          description: Non-numeric id
        "401":
          description: Missing or invalid token
        "403":
          description: Not an admin of this organization
        "404":
          description: Unknown organization
  /invites/{code}/accept:
    post:
      tags: [Organizations]
      summary: Join an organization with an invite code
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Joined as MEMBER
        "401":
          description: Missing or invalid token
        "404":
          description: Unknown, used or expired code
        "409":
          description: Already a member
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
        password: { type: string, minLength: 8, example: supersecret }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: jan@example.com }
        password: { type: string, example: supersecret }
    UpdateAccountRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, example: supersecret }
        newPassword: { type: string, minLength: 8, example: evenmoresecret }
    UserResponse:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, example: 5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10 }
    Car:
      oneOf:
        - $ref: "#/components/schemas/ICECar"
        - $ref: "#/components/schemas/BEVCar"
        - $ref: "#/components/schemas/FCEVCar"
      discriminator:
        propertyName: type
        mapping:
          ICE: "#/components/schemas/ICECar"
          BEV: "#/components/schemas/BEVCar"
          FCEV: "#/components/schemas/FCEVCar"
    ICECar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, fuelType, tankCapacityLitres, consumptionLitresPer100Km]
      properties:
        type: { type: string, enum: [ICE] }
        id: { type: integer, example: 1 }
        ownerId: { type: integer, example: -1, description: "The user who offers the car, -1 for the sample fleet" }
        brand: { type: string, example: Peugeot }
        licensePlate: { type: string, example: 85-GHB-2 }
        mileage: { type: integer, example: 217349 }
        status: { type: string, enum: [Available, Rented, Maintenance] }
        rate: { type: number, example: 25.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 5 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Hatchback }
        modelYear: { type: integer, example: 2008 }
        power: { type: integer, example: 95 }
        transmission: { type: string, enum: [Manual, Automatic], example: Manual }
        color: { type: string, example: Black }
        fuelType: { type: string, enum: [Petrol, Diesel, LPG] }
        tankCapacityLitres: { type: number, example: 50.0 }
        consumptionLitresPer100Km: { type: number, example: 6.1 }
    BEVCar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, batteryCapacityKwh, consumptionKwhPer100Km]
      properties:
        type: { type: string, enum: [BEV] }
        id: { type: integer, example: 2 }
        ownerId: { type: integer, example: -1, description: "The user who offers the car, -1 for the sample fleet" }
        brand: { type: string, example: "Tesla Model 3" }
        licensePlate: { type: string, example: K-123-BV }
        mileage: { type: integer, example: 48210 }
        status: { type: string, enum: [Available, Rented, Maintenance] }
        rate: { type: number, example: 55.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2021 }
        power: { type: integer, example: 208 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: White }
        batteryCapacityKwh: { type: number, example: 60.0 }
        consumptionKwhPer100Km: { type: number, example: 14.5 }
    FCEVCar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, tankCapacityKg, consumptionKgPer100Km]
      properties:
        type: { type: string, enum: [FCEV] }
        id: { type: integer, example: 3 }
        ownerId: { type: integer, example: -1, description: "The user who offers the car, -1 for the sample fleet" }
        brand: { type: string, example: "Toyota Mirai" }
        licensePlate: { type: string, example: XT-482-H }
        mileage: { type: integer, example: 32500 }
        status: { type: string, enum: [Available, Rented, Maintenance] }
        rate: { type: number, example: 70.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2022 }
        power: { type: integer, example: 134 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: Blue }
        tankCapacityKg: { type: number, example: 5.6 }
        consumptionKgPer100Km: { type: number, example: 0.76 }
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, example: 52.3676 }
        longitude: { type: number, example: 4.9041 }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Rent Co }
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Rent Co }
    InviteResponse:
      type: object
      required: [code]
      properties:
        code: { type: string, example: 5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10 }
    CarRequest:
      type: object
      required: [type, brand, licensePlate, mileage, rate, location, doors, bodyStyle, modelYear, power, transmission, color, capacity, consumption]
      properties:
        type: { type: string, enum: [ICE, BEV, FCEV], example: BEV }
        brand: { type: string, example: Test Motors }
        licensePlate: { type: string, example: EV-100 }
        mileage: { type: integer, minimum: 0, example: 1200 }
        rate: { type: number, minimum: 0, example: 45.5 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2024 }
        power: { type: integer, example: 150 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: Blue }
        fuelType: { type: string, enum: [Petrol, Diesel, LPG], description: Required for ICE }
        capacity: { type: number, example: 75.0, description: "Battery in kWh (BEV), tank in litres (ICE) or kg (FCEV)" }
        consumption: { type: number, example: 16.2, description: Per 100 km, in the unit of the capacity }
