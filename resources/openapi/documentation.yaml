openapi: 3.0.3
info:
  title: Rent my car API
  version: 0.1.0
  description: Cars, accounts and organizations are stored in PostgreSQL. Login tokens are stored hashed and expire 7 days after login, so a restart does not log anyone out. Every error response has the body {"error": "<code>", "message": "<text>"}. Lists are paged with limit and offset, and X-Total-Count holds the size of the whole list.
paths:
  /cars:
    get:
      tags: [Cars]
      summary: List cars
      description: The filters can be combined, and any invalid value gives 400. sort orders by rate, range (km on a full tank or battery) or costPerKm (energy cost per km at the standard prices), with a leading - for descending; equal values keep the fleet order. With a location (lat and lon) the cars are sorted nearest first and sort is only validated. With date and daypart only the cars that are free then are listed (not reserved, not in Maintenance). Every car has an averageRating (null without ratings), calculated for all cars in one query.
      parameters:
        - { name: date, in: query, description: "ISO date, today or later. Together with daypart", schema: { type: string, format: date, example: "2026-10-12" } }
        - { name: daypart, in: query, description: Together with date, schema: { type: string, enum: [MORNING, AFTERNOON, EVENING] } }
        - { name: type, in: query, schema: { type: string, enum: [BEV, ICE, FCEV] } }
        - { name: maxRate, in: query, description: Highest rate, schema: { type: number, example: 40 } }
        - { name: bodyStyle, in: query, schema: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other] } }
        - { name: transmission, in: query, schema: { type: string, enum: [Manual, Automatic] } }
        - { name: fuelType, in: query, description: Only combustion (ICE) cars have a fuel, so other cars are left out, schema: { type: string, enum: [Petrol, Diesel, LPG] } }
        - { name: minRange, in: query, description: Shortest range in km (capacity / consumption * 100), schema: { type: number, minimum: 0, example: 400 } }
        - { name: sort, in: query, description: A leading - sorts descending, schema: { type: string, enum: [rate, -rate, range, -range, costPerKm, -costPerKm], example: costPerKm } }
        - { name: lat, in: query, description: Latitude (together with lon), schema: { type: number, example: 51.59 } }
        - { name: lon, in: query, description: Longitude (together with lat), schema: { type: number, example: 4.78 } }
        - { name: maxDistanceKm, in: query, description: Needs lat and lon, schema: { type: number, example: 5 } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: One page of the matching cars. The number of matching cars is in X-Total-Count.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
        "400":
          description: Unknown type, a non-numeric value, only one of lat and lon, or maxDistanceKm without lat and lon, only one of date and daypart, an invalid date or daypart, a past date, or a limit or offset outside the paging rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Cars]
      summary: Offer a car
      description: The logged-in user becomes the owner. With an organizationId the car belongs to that organization instead (it has no owner), which takes membership. A new car is always Available. fuelType is only for ICE, and capacity and consumption are always required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Malformed body, or a missing, unknown or out-of-range field (a negative mileage, rate, capacity or consumption, a last service below 0 or above the mileage, a missing capacity)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: You are not a member of the organization, or it doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another car already has this license plate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/compare:
    get:
      tags: [Cars]
      summary: Compare car types for a distance
      description: Per type (BEV, ICE, FCEV) the average over its cars of the energy cost at the standard prices and the CO2 for the distance, both rounded to 2 decimals. A type without cars is left out, and the types come in the order BEV, ICE, FCEV. The rental rate is not part of it. CO2 is tank to wheel with our own rounded approximations per litre (petrol 2.3 kg, diesel 2.7 kg, LPG 1.5 kg), so electric and hydrogen cars count as 0. ICE averages its petrol, diesel and LPG cars together. No login needed.
      parameters:
        - { name: distanceKm, in: query, required: true, description: Distance, 1 to 10000, schema: { type: number, minimum: 1, maximum: 10000, example: 100 } }
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compare"
        "400":
          description: A missing, non-numeric or out-of-range distanceKm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/cost-per-km:
    get:
      tags: [Cars]
      summary: Running cost per km
      description: Energy cost of one km at the standard prices (petrol 2.10, diesel 1.90, LPG 1.00 per litre, electricity 0.35 per kWh, hydrogen 12.00 per kg), rounded to 4 decimals. No login needed.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The cost per km
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostPerKm"
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/quote:
    get:
      tags: [Cars]
      summary: Quote a trip before reserving
      description: Energy cost of the distance at the standard prices plus the car's rental rate as stored (it is not scaled by distance or duration). Energy cost and rate are rounded to 2 decimals first, and total is their sum. No login needed.
      parameters:
        - $ref: "#/components/parameters/id"
        - { name: distanceKm, in: query, required: true, description: Distance of the trip, 1 to 10000, schema: { type: number, minimum: 1, maximum: 10000, example: 120 } }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Non-numeric id, or a missing, non-numeric or out-of-range distanceKm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/tco:
    get:
      tags: [Cars]
      summary: Total cost of ownership per year
      description: The owner, or a member of the organization for an organization car. Depreciation (the purchase price spread over 10 years) plus insurance, road tax, maintenance and the energy cost for kmPerYear at the standard prices, rounded to 2 decimals. kmPerYear is a whole number of km and defaults to 15000.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - { name: kmPerYear, in: query, description: Km driven per year, schema: { type: integer, minimum: 0, default: 15000, example: 12000 } }
      responses:
        "200":
          description: The TCO per year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tco"
        "400":
          description: Non-numeric id, or a negative or non-numeric kmPerYear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your car, or an organization car and you are not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/images:
    post:
      tags: [Cars]
      summary: Add a photo to a car
      description: Multipart form with the photo in the part `file` (the first one counts), JPEG or PNG up to 5 MB, at most 10 photos per car. The owner, or a member of the organization for an organization car. The type is read from the file itself, not from its name or declared type. The file is stored under a name the server makes up.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Photo added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          description: Non-numeric id, a body that isn't multipart, no `file` part, or a file that isn't a JPEG or PNG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your car, or an organization car and you are not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The car already has 10 photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /images/{name}:
    get:
      tags: [Cars]
      summary: Download a photo
      description: The url from `images` of a car. No login needed.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, example: 5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10.jpg } }
      responses:
        "200":
          description: The photo
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404":
          description: Not a photo of ours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/reservations:
    post:
      tags: [Reservations]
      summary: Reserve a car for a daypart
      description: The logged-in user is the renter. A car is rented per daypart (MORNING 06:00-12:00, AFTERNOON 12:00-18:00, EVENING 18:00-24:00, local time), once per car, date and daypart. Today can be reserved, the past can't.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "201":
          description: Reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Malformed body, a date in the past or not a date, an unknown daypart, or a non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That daypart is taken, or the car is in Maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations:
    get:
      tags: [Reservations]
      summary: Your reservations
      description: The reservations of the logged-in user, newest first (by date, then daypart), each with its status. RESERVED is upcoming, COMPLETED means a trip was recorded and CANCELLED was cancelled by the renter.
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RESERVED, COMPLETED, CANCELLED] } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The reservations, an empty list when there are none
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "400":
          description: An unknown status, a limit outside 1-100, a negative offset or a non-numeric value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}:
    delete:
      tags: [Reservations]
      summary: Cancel your reservation
      description: Only the renter, and only until the daypart starts (its from time, local time). The reservation is kept with status CANCELLED and its daypart is free again afterwards.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Cancelled
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The daypart has already started, the reservation has a trip or a started trip, or it is already completed or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/trip:
    post:
      tags: [Trips]
      summary: Record the trip of a reservation and award bonus points
      description: |
        Only the renter of the reservation, once per reservation, and not before the date of the reservation. The app sends what it measured; the server calculates the score and the points.
        The score is 100 minus 5 for every hard acceleration or hard brake per 100 km, never below 0. The points are distanceKm * score / 100, rounded down, and are added to the renter's bonusPoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "201":
          description: Trip recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "400":
          description: Non-numeric id, a missing or non-integer field, a negative number, 0 km, or more than 10000 km
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The reservation already has a trip, is cancelled, its trip was started (end it with /trip/end), or its date has not come yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/trip/start:
    post:
      tags: [Trips]
      summary: Start the trip of a reservation
      description: Only the renter of the reservation, on the day of the reservation, once per reservation. The start time is taken by the server. End the trip with POST /reservations/{id}/trip/end.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Trip started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTripResponse"
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The reservation is not today or is cancelled, or its trip was already started or finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/trip/end:
    post:
      tags: [Trips]
      summary: End a started trip and award bonus points
      description: |
        Same body, score and points as POST /reservations/{id}/trip. The trip must have been started with POST /reservations/{id}/trip/start and can be ended once. The trip gets its startedAt and its durationMinutes (whole minutes from the start to now, rounded up, at least 1).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
      responses:
        "201":
          description: Trip ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "400":
          description: Non-numeric id, a missing or non-integer field, a negative number, 0 km, or more than 10000 km. The trip stays started, so the app can send it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The trip was never started, or already has an end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trips:
    get:
      tags: [Trips]
      summary: Your trip history
      description: The trips of the logged-in user, newest first (by date, then daypart). The filters can be combined.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tripFrom"
        - $ref: "#/components/parameters/tripTo"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The trips, an empty list when there are none
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripHistoryItem"
        "400":
          description: A from or to that is not an ISO date, from after to, a limit outside 1-100, a negative offset or a non-numeric value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/trips:
    get:
      tags: [Trips]
      summary: The trips of a car
      description: Everyone's trips with this car, newest first. Only for those who manage the car, the owner of a private car or a member of the organization of an organization car.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/tripFrom"
        - $ref: "#/components/parameters/tripTo"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The trips, an empty list when there are none
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripHistoryItem"
        "400":
          description: Non-numeric id, or an invalid filter (see GET /trips)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a car you manage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/stats:
    get:
      tags: [Trips]
      summary: Your driving totals
      description: Calculated from your finished trips in one query; a started trip that has not ended does not count. averageScore (one decimal) and bestDaypart (the daypart with the highest average score, the earliest on a tie) are null without trips.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrivingStats"
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /leaderboard:
    get:
      tags: [Trips]
      summary: The drivers with the most bonus points
      description: Public. Shows only the name and the points, never the email. The most points come first and equal points are ordered by name, then id. Users without points are not listed.
      parameters:
        - { name: limit, in: query, description: How many drivers per page, 1 to 100 (default 10), schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The top drivers, empty when nobody has points
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "400":
          description: A limit that is not a whole number from 1 to 100, or an offset that is not a whole number from 0 up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/rating:
    post:
      tags: [Ratings]
      summary: Rate the car of your reservation
      description: Once per reservation, after its trip is finished (a trip that was started but not ended is not finished). stars is 1 to 5 and the comment is optional, trimmed, and at most 500 characters.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
      responses:
        "201":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Non-numeric id, a missing or non-integer stars, stars outside 1 to 5, or a comment above 500 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The reservation has no finished trip, or was already rated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/ratings:
    get:
      tags: [Ratings]
      summary: The ratings of a car
      description: Newest first, with the average (one decimal, null without ratings) and the count. A rating has no data of the renter. All ratings are in one list, there is no paging.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarRatings"
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/availability:
    get:
      tags: [Reservations]
      summary: Free dayparts of a car on a date
      description: Empty when the car is in Maintenance.
      parameters:
        - $ref: "#/components/parameters/id"
        - { name: date, in: query, required: true, description: ISO date, schema: { type: string, format: date, example: "2026-10-12" } }
      responses:
        "200":
          description: The free dayparts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          description: Non-numeric id, or a missing or invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}/service:
    put:
      tags: [Cars]
      summary: Mark a car as serviced
      description: Sets `lastServiceKm` to the current mileage, for the owner of a private car or a member of the organization of an organization car. No body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: The last service is now the current mileage
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your car, and you are no member of its organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cars/{id}:
    get:
      tags: [Cars]
      summary: Get a car
      description: "The car, with the urls of its photos in `images` (oldest first), its `averageRating` (null without ratings) and `serviceDue`, true when more than 15000 km have passed since the last service (`mileage` minus `lastServiceKm`)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The car, plus an `images` array of urls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Car"
                  - type: object
                    properties:
                      images: { type: array, items: { type: string, example: /images/5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10.jpg } }
                      serviceDue: { type: boolean, example: false }
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Cars]
      summary: Update your own car, or an organization car as a member
      description: Same body as POST /cars. The owner, the organization and the status stay as they are, and the type can't change. A cost field that is left out keeps its current value.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "200":
          description: Car updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Non-numeric id, invalid field, unknown field or a different type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your car, or an organization car and you are not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another car already has this license plate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Cars]
      summary: Delete your own car, or an organization car as an admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Car deleted
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your car, or an organization car and you are not an admin of it (a plain member can update but not delete it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts:
    post:
      tags: [Accounts]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created (the password is never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Missing or invalid field (empty name, invalid email, password shorter than 8 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login:
    post:
      tags: [Accounts]
      summary: Log in and get a bearer token
      description: Copy the token into "Authorize" at the top of the page to call endpoints that need a login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Missing field or a body that isn't JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 5 failed logins for this email within 15 minutes. The email is locked until the oldest of those failures is 15 minutes old, also for the correct password. Unknown emails count too, so the answer doesn't show whether an account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Seconds until the email may try again
              schema: { type: integer, example: 840 }
  /logout:
    post:
      tags: [Accounts]
      summary: Log out
      description: Revokes the token of this request only. Your other logins keep working.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}:
    put:
      tags: [Accounts]
      summary: Update your own name and email
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Non-numeric id, empty name or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Accounts]
      summary: Delete your own account
      description: Your cars are deleted too.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Account deleted
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: You are the last admin of an organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/password:
    put:
      tags: [Accounts]
      summary: Change your own password
      description: Your other logins are logged out, the one you are using keeps working.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Non-numeric id or a new password shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Someone else's account, or the current password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      description: The logged-in user becomes its admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Empty name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organizations/{id}/invites:
    post:
      tags: [Organizations]
      summary: Create an invite code (admin only)
      description: The code works once and expires after 7 days.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organizations/{id}/report:
    get:
      tags: [Organizations]
      summary: Usage and TCO per car of the organization
      description: One row per organization car, in car order. reservations leaves out cancelled ones, trips and totalKm count finished trips, averageScore has one decimal and is null without trips, tcoPerYear is the TCO at 15000 km a year in EUR. Every member may read it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - { name: format, in: query, description: "json (default) or csv, the same rows with a header line", schema: { type: string, enum: [json, csv] } }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarReportRow"
            text/csv:
              schema:
                type: string
                example: "carId,brand,licensePlate,reservations,trips,totalKm,averageScore,tcoPerYear\r\n4,Tesla,EV-1,3,2,40,80.5,850.50\r\n"
        "400":
          description: Non-numeric id or an unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites/{code}/accept:
    post:
      tags: [Organizations]
      summary: Join an organization with an invite code
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Joined as MEMBER
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown, used or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organizations/{id}/members/{userId}:
    put:
      tags: [Organizations]
      summary: Change the role of a member (admin only)
      description: The last admin can't be demoted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - name: userId
          in: path
          required: true
          schema: { type: integer, example: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: Non-numeric id, or a malformed body or unknown role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown organization or member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The last admin can't be demoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Organizations]
      summary: Remove a member or leave
      description: An admin can remove anyone, a member only themselves. The last admin can't be removed or leave.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - name: userId
          in: path
          required: true
          schema: { type: integer, example: 2 }
      responses:
        "204":
          description: Member removed
        "400":
          description: Non-numeric id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin, and not yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown organization or member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The last admin can't leave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
    tripFrom:
      name: from
      in: query
      description: First date of the reservation, inclusive
      schema: { type: string, format: date, example: "2026-10-01" }
    tripTo:
      name: to
      in: query
      description: Last date of the reservation, inclusive
      schema: { type: string, format: date, example: "2026-10-31" }
    limit:
      name: limit
      in: query
      description: How many items per page, 1 to 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    offset:
      name: offset
      in: query
      description: How many items to skip, to get the next page
      schema: { type: integer, minimum: 0, default: 0 }
  headers:
    TotalCount:
      description: The size of the whole list, so a client knows how many pages there are. The body is only the page that was asked for.
      schema: { type: integer, example: 42 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      description: The body of every error response (400, 401, 403, 404, 405, 409, 413, 415, 429 and 500), also for errors that Ktor itself answers.
      required: [error, message]
      properties:
        error: { type: string, description: A code that does not change, from the status, example: not_found }
        message: { type: string, description: A text for people, example: Car with ID 5 not found }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
        password: { type: string, minLength: 8, example: supersecret }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: jan@example.com }
        password: { type: string, example: supersecret }
    UpdateAccountRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, example: supersecret }
        newPassword: { type: string, minLength: 8, example: evenmoresecret }
    UserResponse:
      type: object
      required: [id, name, email, bonusPoints]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Jan }
        email: { type: string, example: jan@example.com }
        bonusPoints: { type: integer, example: 0, description: "Earned by driving calmly, see POST /reservations/{id}/trip" }
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, example: 5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10 }
    Car:
      oneOf:
        - $ref: "#/components/schemas/ICECar"
        - $ref: "#/components/schemas/BEVCar"
        - $ref: "#/components/schemas/FCEVCar"
      discriminator:
        propertyName: type
        mapping:
          ICE: "#/components/schemas/ICECar"
          BEV: "#/components/schemas/BEVCar"
          FCEV: "#/components/schemas/FCEVCar"
    ICECar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, fuelType, tankCapacityLitres, consumptionLitresPer100Km, purchasePrice, insurancePerYear, roadTaxPerYear, maintenancePerYear]
      properties:
        type: { type: string, enum: [ICE] }
        id: { type: integer, example: 1 }
        ownerId: { type: integer, nullable: true, example: -1, description: "The user who offers the car, -1 for the sample fleet, null for an organization car" }
        organizationId: { type: integer, nullable: true, example: null, description: The organization that owns the car, null for a private car }
        brand: { type: string, example: Peugeot }
        licensePlate: { type: string, example: 85-GHB-2 }
        mileage: { type: integer, example: 217349 }
        lastServiceKm: { type: integer, example: 217349, description: "The mileage at the last service. A new car counts as serviced at its mileage; PUT /cars/{id}/service sets it to the current mileage" }
        status: { type: string, enum: [Available, Maintenance] }
        rate: { type: number, example: 25.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 5 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Hatchback }
        modelYear: { type: integer, example: 2008 }
        power: { type: integer, example: 95 }
        transmission: { type: string, enum: [Manual, Automatic], example: Manual }
        color: { type: string, example: Black }
        fuelType: { type: string, enum: [Petrol, Diesel, LPG] }
        tankCapacityLitres: { type: number, example: 50.0 }
        consumptionLitresPer100Km: { type: number, example: 6.1 }
        purchasePrice: { type: number, example: 25000.0, description: EUR }
        insurancePerYear: { type: number, example: 600.0, description: EUR }
        roadTaxPerYear: { type: number, example: 120.0, description: EUR }
        maintenancePerYear: { type: number, example: 450.0, description: EUR }
        averageRating: { type: number, nullable: true, example: 4.3, description: "Average of the ratings, one decimal, null without ratings. Only in GET /cars and GET /cars/{id}" }
    BEVCar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, batteryCapacityKwh, consumptionKwhPer100Km, purchasePrice, insurancePerYear, roadTaxPerYear, maintenancePerYear]
      properties:
        type: { type: string, enum: [BEV] }
        id: { type: integer, example: 2 }
        ownerId: { type: integer, nullable: true, example: -1, description: "The user who offers the car, -1 for the sample fleet, null for an organization car" }
        organizationId: { type: integer, nullable: true, example: null, description: The organization that owns the car, null for a private car }
        brand: { type: string, example: "Tesla Model 3" }
        licensePlate: { type: string, example: K-123-BV }
        mileage: { type: integer, example: 48210 }
        lastServiceKm: { type: integer, example: 48210, description: "The mileage at the last service. A new car counts as serviced at its mileage; PUT /cars/{id}/service sets it to the current mileage" }
        status: { type: string, enum: [Available, Maintenance] }
        rate: { type: number, example: 55.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2021 }
        power: { type: integer, example: 208 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: White }
        batteryCapacityKwh: { type: number, example: 60.0 }
        consumptionKwhPer100Km: { type: number, example: 14.5 }
        purchasePrice: { type: number, example: 25000.0, description: EUR }
        insurancePerYear: { type: number, example: 600.0, description: EUR }
        roadTaxPerYear: { type: number, example: 120.0, description: EUR }
        maintenancePerYear: { type: number, example: 450.0, description: EUR }
        averageRating: { type: number, nullable: true, example: 4.3, description: "Average of the ratings, one decimal, null without ratings. Only in GET /cars and GET /cars/{id}" }
    FCEVCar:
      type: object
      required: [type, id, ownerId, brand, licensePlate, mileage, status, rate, location, doors, bodyStyle, modelYear, power, transmission, color, tankCapacityKg, consumptionKgPer100Km, purchasePrice, insurancePerYear, roadTaxPerYear, maintenancePerYear]
      properties:
        type: { type: string, enum: [FCEV] }
        id: { type: integer, example: 3 }
        ownerId: { type: integer, nullable: true, example: -1, description: "The user who offers the car, -1 for the sample fleet, null for an organization car" }
        organizationId: { type: integer, nullable: true, example: null, description: The organization that owns the car, null for a private car }
        brand: { type: string, example: "Toyota Mirai" }
        licensePlate: { type: string, example: XT-482-H }
        mileage: { type: integer, example: 32500 }
        lastServiceKm: { type: integer, example: 32500, description: "The mileage at the last service. A new car counts as serviced at its mileage; PUT /cars/{id}/service sets it to the current mileage" }
        status: { type: string, enum: [Available, Maintenance] }
        rate: { type: number, example: 70.0 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2022 }
        power: { type: integer, example: 134 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: Blue }
        tankCapacityKg: { type: number, example: 5.6 }
        consumptionKgPer100Km: { type: number, example: 0.76 }
        purchasePrice: { type: number, example: 25000.0, description: EUR }
        insurancePerYear: { type: number, example: 600.0, description: EUR }
        roadTaxPerYear: { type: number, example: 120.0, description: EUR }
        maintenancePerYear: { type: number, example: 450.0, description: EUR }
        averageRating: { type: number, nullable: true, example: 4.3, description: "Average of the ratings, one decimal, null without ratings. Only in GET /cars and GET /cars/{id}" }
    CostPerKm:
      type: object
      required: [carId, costPerKm, currency]
      properties:
        carId: { type: integer, example: 1 }
        costPerKm: { type: number, example: 0.0525 }
        currency: { type: string, example: EUR }
    Quote:
      type: object
      required: [carId, distanceKm, energyCost, rentalRate, total, currency]
      properties:
        carId: { type: integer, example: 1 }
        distanceKm: { type: number, example: 120 }
        energyCost: { type: number, example: 6.3 }
        rentalRate: { type: number, example: 55.0 }
        total: { type: number, example: 61.3 }
        currency: { type: string, example: EUR }
    Compare:
      type: object
      required: [distanceKm, types, currency]
      properties:
        distanceKm: { type: number, example: 100 }
        types:
          type: array
          items:
            type: object
            required: [type, cars, averageCost, co2Kg]
            properties:
              type: { type: string, enum: [BEV, ICE, FCEV] }
              cars: { type: integer, description: Cars of this type in the fleet, example: 3 }
              averageCost: { type: number, description: Average energy cost for the distance, example: 5.25 }
              co2Kg: { type: number, description: Average CO2 for the distance, in kg, example: 13.8 }
        currency: { type: string, example: EUR }
    Image:
      type: object
      required: [id, carId, url]
      properties:
        id: { type: integer, example: 1 }
        carId: { type: integer, example: 7 }
        url: { type: string, example: /images/5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10.jpg }
    Tco:
      type: object
      required: [carId, kmPerYear, tcoPerYear, currency]
      properties:
        carId: { type: integer, example: 1 }
        kmPerYear: { type: integer, example: 12000 }
        tcoPerYear: { type: number, example: 4200.0 }
        currency: { type: string, example: EUR }
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, example: 52.3676 }
        longitude: { type: number, example: 4.9041 }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Rent Co }
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Rent Co }
    InviteResponse:
      type: object
      required: [code]
      properties:
        code: { type: string, example: 5c42d744-8a0e-4d6f-9a52-0c3f1e2b7d10 }
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }
    Membership:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: integer, example: 2 }
        organizationId: { type: integer, example: 1 }
        role: { type: string, enum: [ADMIN, MEMBER] }
    CarReportRow:
      type: object
      required: [carId, brand, licensePlate, reservations, trips, totalKm, averageScore, tcoPerYear]
      properties:
        carId: { type: integer, example: 4 }
        brand: { type: string, example: Tesla }
        licensePlate: { type: string, example: EV-1 }
        reservations: { type: integer, example: 3, description: Not cancelled }
        trips: { type: integer, example: 2, description: Finished trips }
        totalKm: { type: integer, format: int64, example: 40 }
        averageScore: { type: number, nullable: true, example: 80.5 }
        tcoPerYear: { type: number, example: 850.5, description: At 15000 km a year, in EUR }
    ReserveRequest:
      type: object
      required: [date, daypart]
      properties:
        date: { type: string, format: date, example: "2026-10-12" }
        daypart: { type: string, enum: [MORNING, AFTERNOON, EVENING] }
    Reservation:
      type: object
      required: [id, carId, userId, date, daypart, status]
      properties:
        id: { type: integer, example: 1 }
        carId: { type: integer, example: 3 }
        userId: { type: integer, example: 2 }
        date: { type: string, format: date, example: "2026-10-12" }
        daypart: { type: string, enum: [MORNING, AFTERNOON, EVENING] }
        status: { type: string, enum: [RESERVED, COMPLETED, CANCELLED], description: A new reservation is RESERVED; recording the trip makes it COMPLETED; cancelling makes it CANCELLED }
    TripRequest:
      type: object
      required: [distanceKm, hardAccelerations, hardBrakes]
      properties:
        distanceKm: { type: integer, minimum: 1, maximum: 10000, example: 100 }
        hardAccelerations: { type: integer, minimum: 0, example: 2 }
        hardBrakes: { type: integer, minimum: 0, example: 3 }
    Trip:
      type: object
      required: [id, reservationId, distanceKm, score, startedAt, durationMinutes]
      properties:
        id: { type: integer, example: 1 }
        reservationId: { type: integer, example: 1 }
        distanceKm: { type: integer, example: 100 }
        score: { type: integer, minimum: 0, maximum: 100, example: 75 }
        startedAt: { type: string, format: date-time, nullable: true, example: "2026-10-12T08:02:11Z", description: When the trip was started, null for a trip sent in one call }
        durationMinutes: { type: integer, nullable: true, example: 95, description: Whole minutes from start to end (rounded up), null for a trip sent in one call }
    StartTripResponse:
      type: object
      required: [reservationId, startedAt]
      properties:
        reservationId: { type: integer, example: 1 }
        startedAt: { type: string, format: date-time, example: "2026-10-12T08:02:11Z" }
    TripResponse:
      type: object
      required: [trip, pointsAwarded, bonusPoints]
      properties:
        trip: { $ref: "#/components/schemas/Trip" }
        pointsAwarded: { type: integer, example: 75, description: Points this trip earned }
        bonusPoints: { type: integer, example: 75, description: The renter's total after this trip }
    TripHistoryItem:
      type: object
      required: [id, reservationId, carId, date, daypart, distanceKm, score, startedAt, durationMinutes]
      properties:
        id: { type: integer, example: 1 }
        reservationId: { type: integer, example: 4 }
        carId: { type: integer, example: 3 }
        date: { type: string, format: date, example: "2026-10-12" }
        daypart: { type: string, enum: [MORNING, AFTERNOON, EVENING] }
        distanceKm: { type: integer, example: 100 }
        score: { type: integer, minimum: 0, maximum: 100, example: 75 }
        startedAt: { type: string, format: date-time, nullable: true, example: "2026-10-12T08:02:11Z" }
        durationMinutes: { type: integer, nullable: true, example: 95 }
    LeaderboardEntry:
      type: object
      required: [name, bonusPoints]
      properties:
        name: { type: string, example: Jan }
        bonusPoints: { type: integer, example: 75 }
    DrivingStats:
      type: object
      required: [tripCount, totalKm, averageScore, bestDaypart, bonusPoints]
      properties:
        tripCount: { type: integer, example: 3 }
        totalKm: { type: integer, example: 100 }
        averageScore: { type: number, nullable: true, example: 83.3 }
        bestDaypart: { type: string, enum: [MORNING, AFTERNOON, EVENING], nullable: true }
        bonusPoints: { type: integer, example: 75 }
    RatingRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5, example: 4 }
        comment: { type: string, maxLength: 500, example: Clean and quiet }
    Rating:
      type: object
      required: [id, reservationId, carId, stars, comment]
      properties:
        id: { type: integer, example: 1 }
        reservationId: { type: integer, example: 7 }
        carId: { type: integer, example: 3 }
        stars: { type: integer, minimum: 1, maximum: 5, example: 4 }
        comment: { type: string, nullable: true, example: Clean and quiet }
    CarRatings:
      type: object
      required: [carId, averageRating, ratingCount, ratings]
      properties:
        carId: { type: integer, example: 3 }
        averageRating: { type: number, nullable: true, example: 4.3 }
        ratingCount: { type: integer, example: 3 }
        ratings: { type: array, items: { $ref: "#/components/schemas/Rating" } }
    Availability:
      type: object
      required: [carId, date, freeDayparts]
      properties:
        carId: { type: integer, example: 3 }
        date: { type: string, format: date, example: "2026-10-12" }
        freeDayparts: { type: array, items: { type: string, enum: [MORNING, AFTERNOON, EVENING] } }
    CarRequest:
      type: object
      required: [type, brand, licensePlate, mileage, rate, location, doors, bodyStyle, modelYear, power, transmission, color, capacity, consumption]
      properties:
        type: { type: string, enum: [ICE, BEV, FCEV], example: BEV }
        brand: { type: string, example: Test Motors }
        licensePlate: { type: string, example: EV-100 }
        mileage: { type: integer, minimum: 0, maximum: 10000000, example: 1200, description: "In km. Every recorded trip adds its distance" }
        lastServiceKm: { type: integer, minimum: 0, example: 1200, description: "Optional, 0 up to the mileage. A new car without it counts as serviced at its mileage, an update without it keeps the current value" }
        rate: { type: number, minimum: 0, example: 45.5 }
        location: { $ref: "#/components/schemas/Location" }
        doors: { type: integer, example: 4 }
        bodyStyle: { type: string, enum: [Hatchback, SUV, Sedan, Stationwagon, Cabrio, Coupe, MPV, Other], example: Sedan }
        modelYear: { type: integer, example: 2024 }
        power: { type: integer, example: 150 }
        transmission: { type: string, enum: [Manual, Automatic], example: Automatic }
        color: { type: string, example: Blue }
        fuelType: { type: string, enum: [Petrol, Diesel, LPG], description: Required for ICE }
        capacity: { type: number, minimum: 0, example: 75.0, description: "Battery in kWh (BEV), tank in litres (ICE) or kg (FCEV)" }
        consumption: { type: number, minimum: 0, example: 16.2, description: Per 100 km, in the unit of the capacity }
        organizationId: { type: integer, description: "POST only: the car belongs to this organization (you must be a member). On PUT it can be left out or must match the car's current organization" }
        purchasePrice: { type: number, example: 25000.0, description: "EUR. Left out: 0 on POST, the current value on PUT" }
        insurancePerYear: { type: number, example: 600.0, description: "EUR. Left out: 0 on POST, the current value on PUT" }
        roadTaxPerYear: { type: number, example: 120.0, description: "EUR. Left out: 0 on POST, the current value on PUT" }
        maintenancePerYear: { type: number, example: 450.0, description: "EUR. Left out: 0 on POST, the current value on PUT" }
