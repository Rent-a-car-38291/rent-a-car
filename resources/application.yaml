ktor:
    # Development mode shows Swagger UI at /swagger. Set KTOR_DEVELOPMENT=false outside local development.
    development: "$KTOR_DEVELOPMENT:true"
    application:
        modules:
            - org.jetbrains.amper.ktor.ApplicationKt.module
    deployment:
        port: 8080
database:
    url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/rentacar"
    user: "$DATABASE_USER:rentacar"
    password: "$DATABASE_PASSWORD:rentacar"
