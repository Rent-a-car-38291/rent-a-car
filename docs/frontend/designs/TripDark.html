<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip in progress, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#1A1A19;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 330px; background: var(--photo); position: relative; display: flex; align-items: flex-start; justify-content: space-between; padding: 20px; box-sizing: border-box">
<svg role="img" aria-label="Map with the route driven so far" viewBox="0 0 390 330" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"><path d="M40 290 C90 230 60 190 130 180 S230 220 250 150 S300 80 340 70" fill="none" stroke="#D4FF3A" stroke-width="14" stroke-linecap="round"/><path d="M40 290 C90 230 60 190 130 180 S230 220 250 150 S300 80 340 70" fill="none" stroke="var(--route)" stroke-width="4" stroke-linecap="round"/><circle cx="340" cy="70" r="11" fill="var(--route)"/><circle cx="340" cy="70" r="5" fill="#D4FF3A"/></svg>
<span style="position: relative; background: var(--bg); border: 1.5px solid var(--fg); border-radius: 99px; padding: 8px 14px; font-family: 'Space Mono', monospace; font-size: 12px">tesla model 3</span>
<span style="position: relative; background: var(--btn-bg); color: var(--btn-fg); border-radius: 99px; padding: 8px 14px; font-family: 'Space Mono', monospace; font-size: 12px">tracking on</span>
</div>
<div style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted)">time driven</span>
<span style="align-self: flex-start; background: var(--num-bg); color: var(--num-fg); border-radius: 16px; padding: 4px 12px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -3px">00:42</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="border-top: 3px solid var(--fg); padding-top: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -1px">18.4</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">km</span></div>
<div style="border-top: 3px solid var(--fg); padding-top: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -1px">1</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">hard accel.</span></div>
<div style="border-top: 3px solid var(--fg); padding-top: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -1px">0</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">hard brakes</span></div>
</div>
</div>
<div style="padding: 12px 20px 24px">
<a href="ResultDark.html" style="height: 68px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 20px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">end trip</a>
</div>
</div>
</body>
</html>
