<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insights, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -1px">insights</h1>
<div style="display: flex; align-items: flex-end; gap: 12px">
<span style="background: var(--num-bg); color: var(--num-fg); border-radius: 20px; padding: 4px 12px 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -3px">1,240</span>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); padding-bottom: 8px">bonus points</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="border-top: 3px solid var(--fg); padding-top: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: -1px">14</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">trips</span></div>
<div style="border-top: 3px solid var(--fg); padding-top: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: -1px">612</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">km driven</span></div>
<div style="border-top: 3px solid var(--fg); padding-top: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: -1px">88</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">average score</span></div>
</div>
<span style="font-size: 15px">You drive best in the evening.</span>
<svg aria-hidden="true" viewBox="0 0 350 28" preserveAspectRatio="none" style="width: 100%; height: 28px"><path d="M0 14 C29 -6 58 34 88 14 S146 -6 175 14 S233 34 262 14 S321 -6 350 14" fill="none" stroke="var(--wave2)" stroke-width="5"/></svg>
<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -1px">leaderboard</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 48px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); padding: 0 14px; display: flex; align-items: center; gap: 12px"><span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); width: 20px">1</span><span style="flex: 1; font-size: 16px; font-weight: 500">Sanne</span><span style="font-family: 'Space Mono', monospace; font-size: 14px">2,310</span></div>
<div style="height: 48px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); padding: 0 14px; display: flex; align-items: center; gap: 12px"><span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); width: 20px">2</span><span style="flex: 1; font-size: 16px; font-weight: 500">Daan</span><span style="font-family: 'Space Mono', monospace; font-size: 14px">1,875</span></div>
<div style="height: 48px; border-radius: 14px; background: var(--acid); color: #0B0B0B; border: 1.5px solid var(--fg); padding: 0 14px; display: flex; align-items: center; gap: 12px"><span style="font-family: 'Space Mono', monospace; font-size: 13px; width: 20px">3</span><span style="flex: 1; font-size: 16px; font-weight: 500">You</span><span style="font-family: 'Space Mono', monospace; font-size: 14px">1,240</span></div>
<div style="height: 48px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); padding: 0 14px; display: flex; align-items: center; gap: 12px"><span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); width: 20px">4</span><span style="flex: 1; font-size: 16px; font-weight: 500">Noor</span><span style="font-family: 'Space Mono', monospace; font-size: 14px">1,102</span></div>
<div style="height: 48px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); padding: 0 14px; display: flex; align-items: center; gap: 12px"><span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); width: 20px">5</span><span style="flex: 1; font-size: 16px; font-weight: 500">Milan</span><span style="font-family: 'Space Mono', monospace; font-size: 14px">960</span></div>
</div>
</div>
<nav aria-label="Main" style="display: flex; justify-content: space-between; padding: 10px 14px 18px; border-top: 1.5px solid var(--fg); background: var(--bg)">
<a href="SearchDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">find</a>
<a href="BookingsDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">bookings</a>
<a href="MyCarsDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">my cars</a>
<a href="InsightsDark.html" style="height: 44px; padding: 0 16px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">insights</a>
<a href="#" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">account</a>
</nav>
</div>
</body>
</html>
