<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car search, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -1px">find a car</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">free on</span>
<div style="display: flex; gap: 8px">
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--fg); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">wed 11 nov</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font: 500 14px 'Space Grotesk', sans-serif">morning</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">afternoon</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">evening</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">14 cars free</span>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--fg); background: var(--acid); color: #0B0B0B; font: 500 14px 'Space Grotesk', sans-serif">filters (2)</button>
</div>
<div style="background: var(--surface); border: 1.5px solid var(--fg); border-radius: 20px; overflow: hidden">
<div style="height: 104px; background: var(--photo); position: relative; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" viewBox="0 0 390 104" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"><path d="M0 78 C49 48 98 108 146 78 S244 48 293 78 S390 108 390 78" fill="none" stroke="#D4FF3A" stroke-width="5"/><path d="M0 92 C49 62 98 122 146 92 S244 62 293 92 S390 122 390 92" fill="none" stroke="var(--wave2)" stroke-width="5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); position: relative">[CAR PHOTO]</span>
</div>
<div style="padding: 12px 14px 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.5px">tesla model 3</span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">electric · 4.3 ★ · 2 km away</span>
</div>
<span style="background: var(--acid); color: #0B0B0B; border-radius: 10px; padding: 6px 10px; font: 500 15px 'Space Grotesk', sans-serif; white-space: nowrap">€35</span>
</div>
</div>
<div style="background: var(--surface); border: 1.5px solid var(--fg); border-radius: 20px; overflow: hidden">
<div style="height: 104px; background: var(--photo); position: relative; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" viewBox="0 0 390 104" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"><path d="M0 78 C49 108 98 48 146 78 S244 108 293 78 S390 48 390 78" fill="none" stroke="var(--wave3)" stroke-width="5"/><path d="M0 92 C49 122 98 62 146 92 S244 122 293 92 S390 62 390 92" fill="none" stroke="#D4FF3A" stroke-width="5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); position: relative">[CAR PHOTO]</span>
</div>
<div style="padding: 12px 14px 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.5px">toyota mirai</span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">hydrogen · 4.7 ★ · 5 km away</span>
</div>
<span style="background: var(--acid); color: #0B0B0B; border-radius: 10px; padding: 6px 10px; font: 500 15px 'Space Grotesk', sans-serif; white-space: nowrap">€42</span>
</div>
</div>
</div>
<nav aria-label="Main" style="display: flex; justify-content: space-between; padding: 10px 14px 18px; border-top: 1.5px solid var(--fg); background: var(--bg)">
<a href="SearchDark.html" style="height: 44px; padding: 0 16px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">find</a>
<a href="BookingsDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">bookings</a>
<a href="MyCarsDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">my cars</a>
<a href="InsightsDark.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">insights</a>
<a href="#" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">account</a>
</nav>
</div>
</body>
</html>
