<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage car, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="MyCarsDark.html" aria-label="Back to my cars" style="width: 44px; height: 44px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L6 10 L12 16"/></svg></a>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.05; letter-spacing: -1px">tesla model 3</h1><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">AB-123-C · available</span></div>
<a href="AddBasicsDark.html" style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none; box-sizing: border-box">edit</a>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border: 1.5px solid var(--fg); border-radius: 99px; padding: 4px">
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif">photos</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: var(--btn-bg); color: var(--btn-fg); font: 500 13px 'Space Grotesk', sans-serif">service</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif">costs</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif">trips</button>
</div>
<div style="background: var(--wave2); color: #0B0B0B; border: 1.5px solid var(--fg); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px">! service is due</span>
<span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -2px">16,200 km</span>
<span style="font-size: 14px">driven since the last service. A car is due every 15,000 km.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div role="img" aria-label="16,200 of 15,000 km, over the limit" style="height: 14px; border-radius: 99px; border: 1.5px solid var(--fg); position: relative; overflow: hidden"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--fg)"></div><div style="position: absolute; left: 92%; top: 0; bottom: 0; width: 2px; background: var(--bg)"></div></div>
<div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)"><span>0</span><span>15,000 km</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">mileage now</span><span style="font-size: 20px; font-weight: 500">48,200 km</span></div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">last service at</span><span style="font-size: 20px; font-weight: 500">32,000 km</span></div>
</div>
<button style="height: 58px; border-radius: 99px; border: 0; background: var(--btn-bg); color: var(--btn-fg); font: 500 17px 'Space Grotesk', sans-serif">mark as serviced</button>
<span style="font-size: 13px; color: var(--muted); line-height: 1.4">Marking it sets the last service to the mileage now.</span>
</div>
<div style="padding: 12px 20px 24px; border-top: 1.5px solid var(--fg)">
<a href="DetailDark.html" style="height: 48px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); font: 500 15px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">view as renter</a>
</div>
</div>
</body>
</html>
