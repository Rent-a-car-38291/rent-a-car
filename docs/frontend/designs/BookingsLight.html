<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My reservations, light</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#F4F2EA;--surface:#FFFFFF;--fg:#0B0B0B;--muted:#5F5E5A;--line:#D8D5C8;--acid:#D4FF3A;--btn-bg:#0B0B0B;--btn-fg:#D4FF3A;--photo:#DEDBCF;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#0B0B0B;--num-fg:#0B0B0B;--num-bg:#D4FF3A; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -1px">bookings</h1>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border: 1.5px solid var(--fg); border-radius: 99px; padding: 4px">
<button style="height: 44px; border-radius: 99px; border: 0; background: var(--btn-bg); color: var(--btn-fg); font: 500 14px 'Space Grotesk', sans-serif">upcoming</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">done</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">cancelled</button>
</div>
<div style="background: var(--acid); color: #0B0B0B; border: 1.5px solid var(--fg); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'Space Mono', monospace; font-size: 12px">today · morning · 06:00 to 12:00</span><span style="background: #0B0B0B; color: #D4FF3A; border-radius: 99px; padding: 3px 10px; font-family: 'Space Mono', monospace; font-size: 12px">now</span></div>
<span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -1px">tesla model 3</span>
<a href="TripLight.html" style="height: 52px; border-radius: 99px; background: #0B0B0B; color: #D4FF3A; font: 500 16px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">start trip</a>
</div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 12px">
<div style="width: 64px; height: 52px; border-radius: 10px; background: var(--photo)"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: -0.5px">toyota mirai</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">fri 13 nov · evening</span></div>
<span style="border: 1.5px solid var(--fg); border-radius: 99px; padding: 3px 10px; font-family: 'Space Mono', monospace; font-size: 12px">reserved</span>
</div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 12px">
<div style="width: 64px; height: 52px; border-radius: 10px; background: var(--photo)"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: -0.5px">volkswagen golf</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">sat 21 nov · afternoon</span></div>
<span style="border: 1.5px solid var(--fg); border-radius: 99px; padding: 3px 10px; font-family: 'Space Mono', monospace; font-size: 12px">reserved</span>
</div>
<svg aria-hidden="true" viewBox="0 0 350 28" preserveAspectRatio="none" style="width: 100%; height: 28px"><path d="M0 14 C29 -6 58 34 88 14 S146 -6 175 14 S233 34 262 14 S321 -6 350 14" fill="none" stroke="var(--wave3)" stroke-width="5"/></svg>
<a href="SearchLight.html" style="height: 48px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); font: 500 15px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">find another car</a>
</div>
<nav aria-label="Main" style="display: flex; justify-content: space-between; padding: 10px 14px 18px; border-top: 1.5px solid var(--fg); background: var(--bg)">
<a href="SearchLight.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">find</a>
<a href="BookingsLight.html" style="height: 44px; padding: 0 16px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">bookings</a>
<a href="MyCarsLight.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">my cars</a>
<a href="InsightsLight.html" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">insights</a>
<a href="#" style="height: 44px; padding: 0 8px; color: var(--fg); font: 500 13px 'Space Grotesk', sans-serif; display: flex; align-items: center; text-decoration: none">account</a>
</nav>
</div>
</body>
</html>
