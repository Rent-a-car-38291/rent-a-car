<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add car, basics, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="AddKindDark.html" aria-label="Back to step 1" style="width: 44px; height: 44px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L6 10 L12 16"/></svg></a>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted)">offer a car · step 2 of 5</span>
</div>
<div role="img" aria-label="Step 2 of 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<div style="height: 8px; border-radius: 99px; background: var(--fg)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--fg)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
</div>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -1px">the basics</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="brand" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">brand and model</label>
<input id="brand" type="text" value="Tesla Model 3" style="height: 54px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Grotesk', sans-serif; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="plate" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--danger)">license plate</label>
<input id="plate" type="text" value="AB-123-C" aria-invalid="true" aria-describedby="plate-error" style="height: 54px; border-radius: 16px; border: 2.5px solid var(--danger); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Mono', monospace; box-sizing: border-box">
<span id="plate-error" style="font-size: 14px; color: var(--danger); line-height: 1.35">! A car with this license plate already exists.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">body style</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">hatchback</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font: 500 14px 'Space Grotesk', sans-serif">sedan</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">suv</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">stationwagon</button>
<button style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">more</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="doors" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">doors</label>
<input id="doors" type="text" inputmode="numeric" value="4" style="height: 54px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Grotesk', sans-serif; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="year" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">model year</label>
<input id="year" type="text" inputmode="numeric" value="2023" style="height: 54px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Grotesk', sans-serif; box-sizing: border-box; width: 100%">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">transmission</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; border: 1.5px solid var(--fg); border-radius: 99px; padding: 4px">
<button style="height: 44px; border-radius: 99px; border: 0; background: transparent; color: var(--fg); font: 500 14px 'Space Grotesk', sans-serif">manual</button>
<button style="height: 44px; border-radius: 99px; border: 0; background: var(--btn-bg); color: var(--btn-fg); font: 500 14px 'Space Grotesk', sans-serif">automatic</button>
</div>
</div>
</div>
<div style="padding: 12px 20px 24px">
<a href="#" style="height: 58px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 17px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">next</a>
</div>
</div>
</body>
</html>
