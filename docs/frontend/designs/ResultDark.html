<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip result, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 32px 20px 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted)">wed 11 nov · morning · tesla model 3</span>
<div style="display: flex; align-items: flex-end; gap: 12px">
<span style="background: var(--num-bg); color: var(--num-fg); border-radius: 24px; padding: 6px 16px 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 128px; line-height: 1; letter-spacing: -6px">92</span>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); padding-bottom: 14px">out of 100</span>
</div>
<svg aria-hidden="true" viewBox="0 0 350 28" preserveAspectRatio="none" style="width: 100%; height: 28px"><path d="M0 14 C29 -6 58 34 88 14 S146 -6 175 14 S233 34 262 14 S321 -6 350 14" fill="none" stroke="var(--wave2)" stroke-width="5"/></svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -1px">calm drive</h1>
<span style="font-size: 16px">+84 points. You now have 1,240.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">distance</span><span style="font-size: 20px; font-weight: 500">38 km</span></div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">time</span><span style="font-size: 20px; font-weight: 500">52 min</span></div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">hard accelerations</span><span style="font-size: 20px; font-weight: 500">1</span></div>
<div style="background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">hard brakes</span><span style="font-size: 20px; font-weight: 500">0</span></div>
</div>
<div style="height: 112px; background: var(--photo); border-radius: 16px; position: relative; overflow: hidden">
<svg role="img" aria-label="Map of the route you drove" viewBox="0 0 350 112" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%"><path d="M20 90 C70 60 60 30 120 40 S200 90 240 50 S300 20 330 24" fill="none" stroke="#D4FF3A" stroke-width="12" stroke-linecap="round"/><path d="M20 90 C70 60 60 30 120 40 S200 90 240 50 S300 20 330 24" fill="none" stroke="var(--route)" stroke-width="3" stroke-linecap="round"/></svg>
</div>
<span style="font-size: 13px; color: var(--muted); line-height: 1.4">100 for a calm drive, 5 less for every hard acceleration or brake per 100 km.</span>
</div>
<div style="padding: 12px 20px 24px; display: flex; gap: 10px">
<a href="SearchDark.html" style="flex: 1; height: 54px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); font: 500 16px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">done</a>
<a href="#" style="flex: 2; height: 54px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 16px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">rate this car</a>
</div>
</div>
</body>
</html>
