<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add car, kind, light</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#F4F2EA;--surface:#FFFFFF;--fg:#0B0B0B;--muted:#5F5E5A;--line:#D8D5C8;--acid:#D4FF3A;--btn-bg:#0B0B0B;--btn-fg:#D4FF3A;--photo:#DEDBCF;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#0B0B0B;--num-fg:#0B0B0B;--num-bg:#D4FF3A;--danger:#B00020; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="MyCarsLight.html" aria-label="Back to my cars" style="width: 44px; height: 44px; border-radius: 99px; border: 1.5px solid var(--fg); color: var(--fg); display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L6 10 L12 16"/></svg></a>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted)">offer a car · step 1 of 5</span>
</div>
<div role="img" aria-label="Step 1 of 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<div style="height: 8px; border-radius: 99px; background: var(--fg)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
<div style="height: 8px; border-radius: 99px; background: var(--line)"></div>
</div>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -1px">what kind of car is it?</h1>
<div style="display: flex; flex-direction: column; gap: 10px">
<button style="min-height: 104px; border-radius: 20px; border: 1.5px solid var(--fg); background: var(--acid); color: #0B0B0B; padding: 16px 18px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; text-align: left"><span style="font: 700 20px 'Unbounded', sans-serif; letter-spacing: -1px">electric</span><span style="font: 400 13px 'Space Mono', monospace">runs on a battery · picked</span></button>
<button style="min-height: 104px; border-radius: 20px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 16px 18px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; text-align: left"><span style="font: 700 20px 'Unbounded', sans-serif; letter-spacing: -1px">combustion</span><span style="font: 400 13px 'Space Mono', monospace; color: var(--muted)">petrol, diesel or LPG</span></button>
<button style="min-height: 104px; border-radius: 20px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 16px 18px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; text-align: left"><span style="font: 700 20px 'Unbounded', sans-serif; letter-spacing: -1px">hydrogen</span><span style="font: 400 13px 'Space Mono', monospace; color: var(--muted)">runs on a fuel cell</span></button>
</div>
<span style="font-size: 14px; color: var(--muted); line-height: 1.4">The kind can't be changed after the car is added.</span>
</div>
<div style="padding: 12px 20px 24px">
<a href="AddBasicsLight.html" style="height: 58px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 17px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">next</a>
</div>
</div>
</body>
</html>
