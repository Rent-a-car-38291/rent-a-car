<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="--bg:#0B0B0B;--surface:#1A1A19;--fg:#F4F2EA;--muted:#A8A69C;--line:#2E2E2C;--acid:#D4FF3A;--btn-bg:#D4FF3A;--btn-fg:#0B0B0B;--photo:#26215C;--wave2:#FF8AC4;--wave3:#B9A9FF;--route:#D4FF3A;--num-fg:#D4FF3A;--num-bg:transparent;--danger:#FF8AC4; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 300px; background: var(--acid); color: #0B0B0B; position: relative; padding: 36px 20px 0; box-sizing: border-box; overflow: hidden">
<span style="font-family: 'Space Mono', monospace; font-size: 13px; position: relative">rent a car</span>
<h1 style="margin: 14px 0 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -2px; position: relative">welcome back</h1>
<svg aria-hidden="true" viewBox="0 0 390 120" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; width: 100%; height: 120px"><path d="M0 40 C49 0 98 80 146 40 S244 0 293 40 S390 80 390 40" fill="none" stroke="#0B0B0B" stroke-width="6"/><path d="M0 66 C49 26 98 106 146 66 S244 26 293 66 S390 106 390 66" fill="none" stroke="#FF8AC4" stroke-width="6"/><path d="M0 92 C49 52 98 132 146 92 S244 52 293 92 S390 132 390 92" fill="none" stroke="#B9A9FF" stroke-width="6"/></svg>
</div>
<div style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">email</label>
<input id="email" type="email" placeholder="name@example.com" style="height: 54px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Grotesk', sans-serif; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="password" style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted)">password</label>
<input id="password" type="password" placeholder="at least 8 characters" style="height: 54px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--surface); color: var(--fg); padding: 0 16px; font: 400 16px 'Space Grotesk', sans-serif; box-sizing: border-box">
</div>
<a href="SearchDark.html" style="height: 58px; border-radius: 99px; background: var(--btn-bg); color: var(--btn-fg); font: 500 17px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 6px">log in</a>
<a href="#" style="height: 44px; color: var(--fg); font: 500 15px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center">no account yet? create one</a>
</div>
<div style="padding: 0 20px 28px; display: flex; justify-content: center">
<a href="SearchDark.html" style="height: 44px; color: var(--muted); font: 400 14px 'Space Mono', monospace; display: flex; align-items: center">look around first</a>
</div>
</div>
</body>
</html>
