product: jvm/app

settings:
  kotlin:
    serialization:
      enabled: true
  ktor: enabled
  jvm:
    mainClass: org.jetbrains.amper.ktor.ApplicationKt

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.config.yaml
  - ch.qos.logback:logback-classic:1.5.38
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json

test-dependencies:
  - $ktor.server.testHost
